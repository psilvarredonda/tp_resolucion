[project]
name = "album-x4"
version = "0.1.0"
description = "Super-resolución de fotos de archivo con difusión y análisis visual"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1,<2",
    "diffusers==0.42.1",
    "gradio==6.31.0",
    "numpy>=2,<3",
    "pillow>=11.3,<13",
    "safetensors>=0.5,<1",
    "scipy>=1.14,<2",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.22.1",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
